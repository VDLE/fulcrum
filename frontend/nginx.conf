server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Session uploads include screen recordings + heatmaps; they routinely
    # exceed nginx's 1MB default. 2GB is the practical ceiling we expect
    # for a long trial with screen recording.
    client_max_body_size 2048M;

    location /api/ {
        proxy_pass http://backend:5004/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
